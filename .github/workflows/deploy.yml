name: deploy
on:
  push:
    branches: [main]
  # refresh /github (profile, contribution calendar, upstream PRs) without a push
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: true }
permissions: { contents: read }
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: peaceiris/actions-hugo@v3
        with: { hugo-version: "0.169.0", extended: true }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run build
        env:
          # tools/prof.mjs reads public GitHub data through `gh`
          GH_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npx wrangler@4 pages deploy --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
