<section id="yorumlar" class="comments-section" aria-labelledby="comments-title">
  <div class="comments-heading"><h2 id="comments-title">Yorumlar <span id="comment-count" class="comment-count" aria-live="polite"></span></h2></div>
  <div id="comment-list" aria-live="polite"><p class="comments-empty">Yükleniyor…</p></div>

  <form id="comment-form" autocomplete="off">
    <h3>Yorum bırak</h3>
    <p class="form-help">Yorumun onaylandıktan sonra yayımlanır. E-posta adresi gerekmez.</p>
    <label for="c-author">İsim</label>
    <input type="text" id="c-author" maxlength="40" placeholder="Görünen adın" required>
    <label for="c-body">Yorum</label>
    <textarea id="c-body" maxlength="2000" rows="5" placeholder="Ne düşünüyorsun?" required></textarea>
    <div class="cf-turnstile" data-sitekey="{{ site.Params.turnstileSiteKey }}" data-theme="dark"></div>
    <button type="submit">Gönder</button>
    <p id="c-status" role="status"></p>
  </form>
</section>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
(() => {
  const slug = location.pathname;
  const list = document.getElementById("comment-list");
  const form = document.getElementById("comment-form");
  const status = document.getElementById("c-status");
  const count = document.getElementById("comment-count");
  // Same username receives the same locally generated illustrated portrait.
  // Nothing is sent to an external avatar service.
  function avatarFor(author) {
    const label = String(author || "Anonim").trim().toLocaleLowerCase("tr-TR");
    let hash = 2166136261;
    for (const ch of label) hash = Math.imul(hash ^ ch.codePointAt(0), 16777619);
    hash >>>= 0;
    // Independent channels: each trait gets its own mix of the name hash, offset by the
    // golden-ratio constant 0x9E3779B9 (2^32/phi), so traits never share bits.
    const mix = (k) => {
      let x = (hash ^ Math.imul(k, 0x9E3779B9)) >>> 0;
      x = Math.imul(x ^ (x >>> 16), 0x85EBCA6B);
      x = Math.imul(x ^ (x >>> 13), 0xC2B2AE35);
      return (x ^ (x >>> 16)) >>> 0;
    };
    const skins = ["#f2c8a5","#e3b48f","#c98f69","#a86b4a","#7d4b33","#5a3424"];
    const hairs = ["#151311","#2b211b","#4a3326","#7a5534","#b08a5e","#d8c6a3","#8a8a8a","#7c2d1c"];
    // Clothing hue steps the golden angle: neighbouring names land far apart on the wheel.
    // Low saturation keeps it calm; lightness never drops near the black ground.
    const PHI = 0.6180339887498949;
    const hue = Math.round((((mix(3) % 1000) * PHI) % 1) * 360);
    const lit = 36 + (mix(8) % 3) * 5;
    const tone = (dl, s) => "hsl(" + hue + " " + (s == null ? 30 : s) + "% " + (lit + dl) + "%)";
    const cloth = tone(0), shade = tone(-11), light = tone(24, 16);
    const skin = skins[mix(1) % skins.length], hair = hairs[mix(2) % hairs.length];
    const outfit = mix(4) % 3;               // 0 tee, 1 hoodie with hood up, 2 jacket over tee
    const hood = outfit === 1;
    const longHair = !hood && mix(6) % 3 === 0;
    const bun = !hood && !longHair && mix(7) % 7 === 0;
    // Hair is never drawn freehand: it is the skull ellipse cut by a hairline, so it can
    // never spill outside the head. Each entry is the region *above* a hairline.
    const hairlines = [
      "M0 0H64V27Q48 14.5 32 14.5Q16 14.5 0 27Z",
      "M0 0H64V26Q46 12 35 15Q25 12.5 0 26Z",
      "M0 0H64V22Q48 12.5 32 12.5Q16 12.5 0 22Z",
      "M0 0H64V28Q50 16 41 17L37 14L32 18L27 14L23 17Q14 16 0 28Z",
      "M0 0H64V24Q47 15 41 11.5Q32 15.5 23 11.5Q17 15 0 24Z",
      "M0 0H64V27Q52 13 38 13Q30 17 22 15Q12 18 0 27Z"
    ];
    const hairline = hairlines[mix(5) % hairlines.length];
    const ink = "#141414";
    let svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><clipPath id="skull"><ellipse cx="32" cy="25" rx="17" ry="17"/></clipPath></defs><rect width="64" height="64" fill="#000"/>';
    // 1. layers behind the head
    if (hood) svg += '<path d="M12 60Q7 38 10.5 23Q14.5 4.5 32 4Q49.5 4.5 53.5 23Q57 38 52 60Z" fill="' + shade + '"/>';
    if (longHair) svg += '<path d="M15 25Q15 8 32 8Q49 8 49 25V50Q46 47.5 45 40H19Q18 47.5 15 50Z" fill="' + hair + '"/>';
    if (bun) svg += '<circle cx="32" cy="8.5" r="4.2" fill="' + hair + '"/>';
    // 2. garment and neck
    svg += '<path d="M6 64C8 52 18 47.5 32 47.5S56 52 58 64Z" fill="' + cloth + '"/>';
    svg += '<path d="M27.5 44H36.5V49Q32 51.5 27.5 49Z" fill="' + skin + '"/>';
    if (outfit === 0) svg += '<path d="M26 47.6Q32 53 38 47.6" fill="none" stroke="' + shade + '" stroke-width="1.6" stroke-linecap="round"/>';
    if (outfit === 1) svg += '<path d="M18 49Q32 58 46 49" fill="none" stroke="' + shade + '" stroke-width="2.4" stroke-linecap="round"/>'
      + '<path d="M28.5 54L28 61M35.5 54L36 61" stroke="' + light + '" stroke-width="1" stroke-linecap="round"/>';
    if (outfit === 2) svg += '<path d="M25.5 47.8Q32 51 38.5 47.8L32 64Z" fill="' + light + '"/>'
      + '<path d="M25.5 47.8L30.6 64M38.5 47.8L33.4 64" stroke="' + shade + '" stroke-width="1.4"/>';
    // 3. ears only where nothing covers them
    if (!hood && !longHair) svg += '<ellipse cx="15.6" cy="32" rx="2.4" ry="4" fill="' + skin + '"/><ellipse cx="48.4" cy="32" rx="2.4" ry="4" fill="' + skin + '"/>';
    // 4. the mask
    svg += '<path d="M32 9C44 9 49 18 48 30C47 41 41 51 32 55C23 51 17 41 16 30C15 18 20 9 32 9Z" fill="#efe9df"/>'
      + '<circle cx="23" cy="38" r="3.2" fill="#e2a9a0" opacity=".45"/><circle cx="41" cy="38" r="3.2" fill="#e2a9a0" opacity=".45"/>'
      + '<path d="M20 26Q25 21.5 29.5 25.5M34.5 25.5Q39 21.5 44 26" fill="none" stroke="' + ink + '" stroke-width="1.3" stroke-linecap="round"/>'
      + '<path d="M21 30Q25 27.6 29 30Q25 31.6 21 30ZM35 30Q39 27.6 43 30Q39 31.6 35 30Z" fill="#000"/>'
      + '<path d="M32 30.5L31 37Q32 38.2 33 37" fill="none" stroke="#cbbfae" stroke-width=".9" stroke-linecap="round"/>'
      + '<path d="M32 40.6Q36.5 38 40.5 40.4Q43 39.6 44.6 36.6Q43.4 43.2 36.5 42.6Q33.6 42.3 32 41.6Q30.4 42.3 27.5 42.6Q20.6 43.2 19.4 36.6Q21 39.6 23.5 40.4Q27.5 38 32 40.6Z" fill="' + ink + '"/>'
      + '<path d="M26.5 45.2Q32 48.6 37.5 45.2" fill="none" stroke="' + ink + '" stroke-width="1.1" stroke-linecap="round"/>'
      + '<path d="M30.9 48.2Q32 54 33.1 48.2Q32 48.9 30.9 48.2Z" fill="' + ink + '"/>';
    // 5. what sits in front of the mask: hood opening or hair
    if (hood) svg += '<path d="M15 44Q11.5 13 32 9.5Q52.5 13 49 44" fill="none" stroke="' + cloth + '" stroke-width="3.2" stroke-linecap="round"/>';
    else svg += '<path d="' + hairline + '" clip-path="url(#skull)" fill="' + hair + '"/>';
    svg += '</svg>';
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  function renderAuthorReply(reply) {
    const wrap = document.createElement("section");
    wrap.className = "comment-reply author-reply";
    wrap.id = "reply-" + reply.id;
    const head = document.createElement("div");
    head.className = "comment-meta";
    const avatar = document.createElement("img");
    avatar.className = "comment-avatar";
    avatar.src = "/author-mask.jpg";
    avatar.alt = "";
    avatar.width = 46;
    avatar.height = 46;
    avatar.loading = "lazy";
    const identity = document.createElement("div");
    identity.className = "comment-identity";
    const line = document.createElement("div");
    line.className = "author-identity-line";
    const name = document.createElement("a");
    name.className = "comment-author";
    name.href = "/author/";
    name.textContent = String(reply.author || "0x00bedeaf");
    const mark = document.createElement("span");
    mark.className = "author-verified";
    mark.setAttribute("role", "img");
    mark.setAttribute("aria-label", "Blog yazarı");
    mark.title = "Blog yazarı";
    mark.textContent = "✓";
    const date = document.createElement("small");
    date.className = "comment-date";
    if (Number(reply.created_at) > 0) date.textContent = new Date(Number(reply.created_at) * 1000).toLocaleString("tr-TR");
    const body = document.createElement("p");
    body.className = "comment-body";
    body.textContent = String(reply.body || "");
    line.append(name, mark);
    identity.append(line, date);
    head.append(avatar, identity);
    wrap.append(head, body);
    return wrap;
  }

  async function load() {
    try {
      const r = await fetch("/api/comments?slug=" + encodeURIComponent(slug));
      if (!r.ok) throw new Error("Yorum isteği başarısız.");
      const data = await r.json();
      const { comments } = data;
      list.replaceChildren();
      if (!Array.isArray(comments)) throw new Error("Geçersiz yorum yanıtı");
      count.textContent = "(" + comments.length + ")";
      if (!comments.length) {
        const empty = document.createElement("p");
        empty.className = "comments-empty";
        empty.textContent = "Henüz yorum yok. İlk yorumu sen bırakabilirsin.";
        list.append(empty);
        return;
      }
      for (const c of comments) {
        const box = document.createElement("article");
        box.className = "comment";
        box.id = "comment-" + c.id;
        const meta = document.createElement("div");
        meta.className = "comment-meta";
        const avatar = document.createElement("img");
        avatar.className = "comment-avatar";
        avatar.src = avatarFor(c.author);
        avatar.alt = "";
        avatar.setAttribute("aria-hidden", "true");
        avatar.width = 46;
        avatar.height = 46;
        avatar.loading = "lazy";
        const identity = document.createElement("div");
        identity.className = "comment-identity";
        const head = document.createElement("strong");
        head.className = "comment-author";
        head.textContent = c.author || "Anonim";
        const time = document.createElement("small");
        time.className = "comment-date";
        const when = Number(c.created_at);
        if (Number.isFinite(when) && when > 0) time.textContent = new Date(when * 1000).toLocaleString("tr-TR");
        const text = document.createElement("p");
        text.className = "comment-body";
        text.textContent = c.body || "";
        identity.append(head,time);
        meta.append(avatar,identity);
        box.append(meta,text);
        if (Array.isArray(c.replies)) {
          for (const reply of c.replies) box.append(renderAuthorReply(reply));
        }
        list.append(box);
      }
    } catch {
      list.textContent = "Yorumlar yüklenemedi. Sayfayı yenileyip tekrar dene.";
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    status.textContent = "Gönderiliyor…";
    const tokenEl = form.querySelector('[name="cf-turnstile-response"]');
    const res = await fetch("/api/comments", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        slug,
        author: document.getElementById("c-author").value,
        body: document.getElementById("c-body").value,
        token: tokenEl ? tokenEl.value : "",
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (window.turnstile) window.turnstile.reset();
    if (res.ok) {
      form.reset();
      status.textContent = "Yorumun alındı, onaylandıktan sonra görünecek.";
    } else {
      status.textContent = "Hata: " + (data.error || res.status);
    }
  });

  load();
})();
</script>
