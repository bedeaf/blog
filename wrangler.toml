# Cloudflare Pages project: https://bedeaf.pages.dev
# Deploy with `npm run deploy`. worker/index.js is copied to public/_worker.js
# (Pages advanced mode) so /api/* keeps hitting D1; every other request falls
# through to env.ASSETS. Secrets (TURNSTILE_SECRET, IP_SALT) live in the project.
name = "bedeaf"
pages_build_output_dir = "./public"
compatibility_date = "2026-11-07"

[[d1_databases]]
binding = "DB"
database_name = "blog-db"
database_id = "f2a2ce42-f888-4b64-8f9e-786793882ae2"
